map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name botnethunter.duckdns.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name botnethunter.duckdns.org;
	
	client_max_body_size 1024M;
    client_body_buffer_size 128M;
	
    ssl_certificate     /etc/letsencrypt/live/botnethunter.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botnethunter.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass         http://botnethunter:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sonar {
        return 301 /sonar/;
    }

    location /sonar/ {
        proxy_pass         http://sonarqube:9000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Prefix /sonar;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    location /grafana/ {
        proxy_pass         http://45.90.219.56:3000/grafana/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
    }

    location = /trivy {
        return 301 /trivy/;
    }

    location /trivy/ {
        alias /usr/share/nginx/html/trivy/;
        index trivy-image-report.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff;
    }
	
	location /ws/ {
        proxy_pass         http://botnethunter:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass         http://botnethunter:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        proxy_intercept_errors on; 
		proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
