{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow border-primary">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Смена пароля</h5>
                <a href="/dashboard" class="btn btn-sm btn-light">Назад</a>
            </div>
            <div class="card-body p-4">
                {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endif %}

                <p class="text-muted small mb-4">
                    Аккаунт: <span class="fw-semibold">{{ user.email }}</span>
                </p>

                <form method="post" action="/account/change-password">
                    <div class="mb-3">
                        <label for="current_password" class="form-label fw-bold">Текущий пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="current_password"
                            name="current_password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-bold">Новый пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="new_password"
                            name="new_password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                        <div class="form-text">Минимум 8 символов.</div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-bold">Повторите новый пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            Сохранить новый пароль
                        </button>
                        <a href="/dashboard" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
