<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BotNetHunter{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">BotNetHunter</a>
            {% if user %}
                <div class="d-flex align-items-center">
                    <span class="text-light me-3 small">{{ user.email }}</span>
                    <a href="/logout" class="btn btn-outline-light btn-sm">Выйти</a>
                </div>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
	<footer class="text-center py-3 text-muted small border-top mt-auto">
		BotNetHunter v{{ request.state.app_version }} • 
		<a href="/version" class="text-decoration-none">О версии</a> •
		<a href="/api-docs" class="text-decoration-none">API Docs</a>
	</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
