        '500':
          $ref: '#/components/responses/InternalError'

# ─────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT-токен пользователя (алгоритм HS256, TTL 24 ч). Выдаётся при входе через `POST /login`.
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin_token
      description: |
        Токен административной сессии. Значение: `admin_session`.
        Выдаётся при входе с учётными данными администратора через `POST /login`.

  # ── SCHEMAS ────────────────────────────────────────────────────────────────

  schemas:

    ProblemDetail:
      type: object
      description: Структура ошибки по RFC 9457 Problem Details (application/problem+json)
      required: [title, detail, requestId, timestamp]
      properties:
        title:
          type: string
          description: Краткое название ошибки (человекочитаемое).
          example: Ошибка аутентификации
        detail:
          type: string
          description: Подробное описание ошибки и способа её устранения.
          example: Неверный email или пароль. Проверьте введённые данные и попробуйте снова.
        requestId:
          type: string
          format: uuid
          description: |
            Уникальный идентификатор запроса в формате **UUIDv7** (время-зависимый).
            Используется для поиска запроса в журнале событий (логах).
          example: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7890
        timestamp:
          type: string
          format: date-time
          description: Метка времени возникновения ошибки (UTC, ISO 8601).
          example: "2026-04-26T10:00:00Z"

    SuccessMessage:
      type: object
      description: Простое подтверждение успешного выполнения операции
      required: [message]
      properties:
        message:
          type: string
          description: Текстовое описание результата операции.
          example: Операция выполнена успешно.

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email-адрес пользователя. **Обязательное поле.** Используется как логин.
          example: user@example.com
        password:
          type: string
          minLength: 6
          description: Пароль пользователя. **Обязательное поле.** Минимальная длина — 6 символов.
          example: MyStr0ngPass!

    UserProfile:
      type: object
      description: Профиль пользователя системы
      properties:
        id:
          type: integer
          description: Внутренний числовой идентификатор пользователя.
          example: 3
        email:
          type: string
          format: email
          description: Email-адрес пользователя.
          example: user@example.com
        is_active:
          type: boolean
          description: Статус аккаунта. `false` — пользователь заблокирован администратором.
          example: true
        requests_limit:
          type: integer
          description: Дневной лимит запросов анализа.
          example: 100
        requests_today:
          type: integer
          description: Количество запросов, выполненных сегодня.
          example: 12
        created_at:
          type: string
          format: date-time
          description: Дата и время регистрации аккаунта (UTC).
          example: "2026-04-01T09:00:00Z"

    AnalyzeRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Идентификатор цели анализа. **Обязательное поле.**

            Допустимые форматы:
            - Числовой ID пользователя: `12345678`
            - Screen name: `durov`
            - URL профиля: `vk.com/durov` или `https://vk.com/durov`
            - ID группы: `12345678` или `club12345678`
            - URL группы: `vk.com/some_group`
          example: durov
        target_type:
          type: string
          enum: [user, group]
          default: user
          description: |
            Тип цели анализа.
            - `user` — анализ одного профиля пользователя (по умолчанию).
            - `group` — анализ участников группы/сообщества.
          example: user

    AnalysisReason:
      type: object
      description: Один сработавший фактор бот-активности
      properties:
        reason:
          type: string
          description: Текстовое описание сработавшего фактора.
          example: "Нет аватарки (+18 бал.)"
        priority:
          type: string
          enum: [low, medium, high]
          description: |
            Приоритет фактора по количеству начисленных баллов:
            - `low` — менее 8 баллов
            - `medium` — 8–14 баллов
            - `high` — 15 и более баллов
          example: high
        points:
          type: integer
          description: Количество начисленных штрафных баллов.
          example: 18

    AnalysisResultResponse:
      type: object
      description: Результат анализа профиля пользователя или группы ВКонтакте
      properties:
        id:
          type: integer
          description: Идентификатор записи в таблице истории.
          example: 42
        target:
          type: string
          description: Идентификатор проанализированной цели (ID или screen_name).
          example: durov
        target_type:
          type: string
          enum: [user, group]
          description: Тип проанализированной цели.
          example: user
        risk_level:
          type: string
          enum: [NORMAL, LOW, MEDIUM, HIGH]
          description: |
            Итоговый уровень риска:
            - `NORMAL` — 0–14 баллов
            - `LOW` — 15–39 баллов
            - `MEDIUM` — 40–69 баллов
            - `HIGH` — 70–100 баллов
          example: LOW
        score:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Итоговый балл риска от 0 до 100. Заполняется только для `target_type=user`.
          example: 30
        reasons:
          type: array
          nullable: true
          description: Перечень сработавших факторов. Заполняется только для `target_type=user`.
          items:
            $ref: '#/components/schemas/AnalysisReason'
        anomalies:
          type: array
          nullable: true
          description: Список аномалий. Заполняется только для `target_type=user`.
          items:
            type: object
            properties:
              description:
                type: string
                description: Текстовое описание аномалии.
              category:
                type: string
                description: Категория аномалии (например, `profile`, `behavior`).
        members_analyzed:
          type: integer
          nullable: true
          description: Количество проверенных участников. Заполняется только для `target_type=group`.
          example: 87
        average_score:
          type: number
          format: float
          nullable: true
          description: Средний балл риска по группе. Заполняется только для `target_type=group`.
          example: 41.3
        score_distribution:
          type: object
          nullable: true
          description: |
            Распределение участников по диапазонам баллов.
            Заполняется только для `target_type=group`.
            Ключи — строки вида `"0-10"`, `"10-20"`, ..., `"90-100"`.
          additionalProperties:
            type: integer
          example:
            "0-10": 12
            "10-20": 18
            "20-30": 15
        created_at:
          type: string
          format: date-time
          description: Дата и время создания записи (UTC).
          example: "2026-04-26T10:05:00Z"

    HistoryItem:
      type: object
      description: Краткая запись истории анализа (для списка)
      properties:
        id:
          type: integer
          description: Идентификатор записи.
          example: 42
        target:
          type: string
          description: Идентификатор цели анализа.
          example: durov
        target_type:
          type: string
          enum: [user, group]
          description: Тип цели.
          example: user
        risk_level:
          type: string
          enum: [NORMAL, LOW, MEDIUM, HIGH]
          description: Итоговый уровень риска.
          example: LOW
        score:
          type: integer
          nullable: true
          description: Итоговый балл (только для `target_type=user`).
          example: 30
        created_at:
          type: string
          format: date-time
          description: Дата и время анализа (UTC).
          example: "2026-04-26T10:05:00Z"

    AdminUserItem:
      type: object
      description: Данные пользователя для административного списка
      properties:
        id:
          type: integer
          example: 7
        email:
          type: string
          format: email
          example: user@example.com
        is_active:
          type: boolean
          description: Статус аккаунта. `false` — заблокирован.
          example: true
        is_admin:
          type: boolean
          description: Признак наличия прав администратора.
          example: false
        requests_limit:
          type: integer
          description: Дневной лимит запросов.
          example: 100
        requests_today:
          type: integer
          description: Количество запросов сегодня.
          example: 12
        created_at:
          type: string
          format: date-time
          description: Дата регистрации (UTC).
          example: "2026-04-01T09:00:00Z"

    ModuleWeights:
      type: object
      description: |
        Глобальные коэффициенты влияния аналитических модулей на итоговый балл.
        Итоговый балл = сумма(балл_модуля × вес_модуля). Все поля обязательны.
      required:
        - profile_analyzer
        - social_graph_analyzer
        - behavior_analyzer
        - cross_check_analyzer
      properties:
        profile_analyzer:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
          description: |
            Вес модуля анализа профиля. **Обязательное поле.**
            Анализирует: имя, аватарку, заполненность профиля, возраст аккаунта.
            Допустимые значения: от 0.1 до 5.0.
          example: 1.0
        social_graph_analyzer:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
          description: |
            Вес модуля анализа социального графа. **Обязательное поле.**
            Анализирует: географию и структуру списка друзей.
            Допустимые значения: от 0.1 до 5.0.
          example: 1.2
        behavior_analyzer:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
          description: |
            Вес модуля поведенческого анализа. **Обязательное поле.**
            Анализирует: посты стены, активность, паттерны публикаций.
            Допустимые значения: от 0.1 до 5.0.
          example: 0.9
        cross_check_analyzer:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
          description: |
            Вес модуля кросс-проверки. **Обязательное поле.**
            Анализирует: логические противоречия в полях профиля и данных друзей.
            Допустимые значения: от 0.1 до 5.0.
          example: 1.1

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      description: Запрос на смену пароля
      properties:
        current_password:
          type: string
          description: Текущий пароль пользователя. **Обязательное поле.**
          example: OldPass123
        new_password:
          type: string
          minLength: 8
          description: |
            Новый пароль. **Обязательное поле.**
            Минимальная длина — 8 символов. Должен отличаться от текущего пароля.
          example: NewStr0ngPass!
        confirm_password:
          type: string
          minLength: 8
          description: Подтверждение нового пароля. **Обязательное поле.** Должно совпадать с `new_password`.
          example: NewStr0ngPass!

    HealthResponse:
      type: object
      description: Ответ эндпоинта проверки работоспособности
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Текущий статус приложения.
          example: ok
        version:
          type: string
          description: Текущая версия приложения (из файла `VERSION` или переменной `APP_VERSION`).
          example: "2.0.0"

    VersionResponse:
      type: object
      description: Информация о версии приложения и VK API
      required: [version, api_version, build]
      properties:
        version:
          type: string
          description: Версия приложения.
          example: "2.0.0"
        api_version:
          type: string
          description: Используемая версия VK API (с префиксом `v`).
          example: "v5.131"
        build:
          type: string
          description: Номер сборки из переменной окружения `BUILD_NUMBER`. Значение `local` при локальном запуске.
          example: "42"

    ModuleParameterItem:
      type: object
      description: Один параметр аналитического модуля
      required: [value]
      properties:
        value:
          type: integer
          description: Текущее значение параметра (штрафные баллы или порог).
          example: 18
        description:
          type: string
          description: Человекочитаемое описание параметра.
          example: Штраф за отсутствие аватарки

    ModuleConfig:
      type: object
      description: Конфигурация одного аналитического модуля
      required: [global_weight, parameters]
      properties:
        global_weight:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
          description: Глобальный коэффициент модуля.
          example: 1.0
        parameters:
          type: object
          description: Словарь параметров модуля (ключ — имя параметра).
          additionalProperties:
            $ref: '#/components/schemas/ModuleParameterItem'

    ModuleParameters:
      type: object
      description: Параметры всех четырёх аналитических модулей
      required: [profile_analyzer, social_graph_analyzer, behavior_analyzer, cross_check_analyzer]
      properties:
        profile_analyzer:
          $ref: '#/components/schemas/ModuleConfig'
        social_graph_analyzer:
          $ref: '#/components/schemas/ModuleConfig'
        behavior_analyzer:
          $ref: '#/components/schemas/ModuleConfig'
        cross_check_analyzer:
          $ref: '#/components/schemas/ModuleConfig'

  # ── REUSABLE RESPONSES ─────────────────────────────────────────────────────

  responses:

    # 2xx ──────────────────────────────────────────────────────────────────────
    # (201, 202 используются inline в эндпоинтах — они слишком контекстно-зависимы)

    # 4xx ──────────────────────────────────────────────────────────────────────

    BadRequest:
      description: "400 — Некорректный запрос: отсутствует обязательный параметр или неверный формат данных"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Некорректный запрос
            detail: Поле `target` обязательно и не может быть пустым. Укажите ID пользователя или screen_name.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a0
            timestamp: "2026-04-26T10:00:00Z"

    Unauthorized:
      description: "401 — Пользователь не аутентифицирован: cookie `token` отсутствует или истёк"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Требуется аутентификация
            detail: Сессия истекла или не существует. Выполните вход повторно через POST /login.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a1
            timestamp: "2026-04-26T10:00:00Z"

    Forbidden:
      description: "403 — Недостаточно прав: требуются права администратора"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Доступ запрещён
            detail: Для выполнения этого действия необходимы права администратора. Обратитесь к администратору системы.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a2
            timestamp: "2026-04-26T10:00:00Z"

    NotFound:
      description: "404 — Запрошенный ресурс не существует или был удалён"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Ресурс не найден
            detail: Запрошенный объект не существует или был удалён. Проверьте правильность идентификатора.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a3
            timestamp: "2026-04-26T10:00:00Z"

    MethodNotAllowed:
      description: "405 — HTTP-метод не поддерживается данным эндпоинтом"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Метод не поддерживается
            detail: Эндпоинт не поддерживает указанный HTTP-метод. Проверьте документацию и используйте корректный метод.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a4
            timestamp: "2026-04-26T10:00:00Z"

    Conflict:
      description: "409 — Конфликт данных: ресурс с такими параметрами уже существует"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Конфликт данных
            detail: Пользователь с указанным email уже зарегистрирован. Используйте другой адрес или выполните вход.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a5
            timestamp: "2026-04-26T10:00:00Z"

    PayloadTooLarge:
      description: "413 — Тело запроса превышает допустимый размер (максимум 1 МБ)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Тело запроса слишком велико
            detail: Размер тела запроса превышает допустимый предел в 1 МБ. Уменьшите объём передаваемых данных.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a6
            timestamp: "2026-04-26T10:00:00Z"

    URITooLong:
      description: "414 — URI запроса превышает допустимую длину (максимум 2048 символов)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: URI слишком длинный
            detail: Длина URI запроса превышает допустимый предел в 2048 символов. Сократите параметры запроса.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a7
            timestamp: "2026-04-26T10:00:00Z"

    UnsupportedMediaType:
