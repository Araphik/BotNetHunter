openapi: 3.1.0

info:
  title: BotNetHunter API
  version: 2.0.0
  description: |
    API системы выявления ботов в социальной сети ВКонтакте.

    ## Изменения в версии 2.0.0
    - СУБД заменена с SQLite на **PostgreSQL 16** (через psycopg3, SQLAlchemy 2.0).
    - VK API-токены перенесены из файла `tokens.txt` в переменные окружения `VK_TOKEN_1`, `VK_TOKEN_2`, ...
    - Учётные данные администратора перенесены в переменные окружения `ADMIN_EMAIL` / `ADMIN_PASSWORD`.
    - Добавлен Nginx как обратный прокси (порты 80/443).
    - Middleware теперь дополнительно принимает `application/x-www-form-urlencoded` и `multipart/form-data`.
    - Добавлены эндпоинты: смена пароля, сброс весов, параметры модулей, глобальный лимит, `/health`, `/api/version`.

    ## Аутентификация
    После успешного входа сервер выставляет **HttpOnly cookie** `token` (JWT HS256, TTL 24 ч).
    Все защищённые эндпоинты требуют наличия этой cookie.
    Административные эндпоинты дополнительно требуют cookie `admin_token=admin_session`.

    ## Поддерживаемые типы содержимого запроса (Content-Type)
    Для эндпоинтов с телом запроса сервер принимает:
    - `application/json`
    - `application/x-www-form-urlencoded`
    - `multipart/form-data`

    ## Структура ошибок
    Все ответы 4xx / 5xx возвращают JSON-тело с Content-Type `application/problem+json`
    в соответствии со стандартом **RFC 9457 Problem Details**.

    Поля ошибки:
    - `title` — краткое описание ошибки.
    - `detail` — подробное описание и способ устранения.
    - `requestId` — идентификатор запроса в формате **UUIDv7** (время-зависимый) для поиска в логах.
    - `timestamp` — метка времени в формате UTC (ISO 8601).

servers:
  - url: http://localhost:8000
    description: Локальная разработка (без Nginx, напрямую к Uvicorn)
  - url: http://localhost:80
    description: Docker Compose (через Nginx, порт 80)

tags:
  - name: auth
    description: Регистрация, вход и выход
  - name: analysis
    description: Анализ профилей и групп ВКонтакте
  - name: history
    description: История запросов текущего пользователя
  - name: account
    description: Управление собственным аккаунтом
  - name: admin
    description: Административная панель
  - name: system
    description: Служебные эндпоинты (health-check, версия)

# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── AUTH ──────────────────────────────────────────────────────────────────

  /register:
    post:
      tags: [auth]
      summary: Регистрация нового пользователя
      operationId: registerUser
      description: |
        Создаёт новый аккаунт. При успехе выставляет HttpOnly JWT-cookie `token`
        и возвращает профиль созданного пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              email: user@example.com
              password: MyStr0ngPass!
      responses:
        '201':
          description: Пользователь успешно создан
          headers:
            Set-Cookie:
              description: HttpOnly JWT-cookie `token` (TTL 24 ч)
              schema:
                type: string
                example: "token=eyJ...; Path=/; HttpOnly; Max-Age=86400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 3
                email: user@example.com
                is_active: true
                requests_limit: 100
                requests_today: 0
                created_at: "2026-04-26T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '418':
          $ref: '#/components/responses/Teapot'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /login:
    post:
      tags: [auth]
      summary: Вход в систему
      operationId: loginUser
      description: |
        Аутентифицирует пользователя по email и паролю.
        При успехе выставляет HttpOnly JWT-cookie `token`.
        Для входа администратора используйте те же учётные данные —
        в ответе дополнительно выставляется cookie `admin_token=admin_session`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              email: user@example.com
              password: MyStr0ngPass!
      responses:
        '200':
          description: Успешный вход
          headers:
            Set-Cookie:
              description: HttpOnly JWT-cookie `token` (TTL 24 ч)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 3
                email: user@example.com
                is_active: true
                requests_limit: 100
                requests_today: 5
                created_at: "2026-04-01T09:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверные учётные данные
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Ошибка аутентификации
                detail: Неверный email или пароль. Проверьте введённые данные и попробуйте снова.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7891
                timestamp: "2026-04-26T10:01:00Z"
        '403':
          description: Аккаунт заблокирован администратором
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Аккаунт заблокирован
                detail: Ваш аккаунт заблокирован. Обратитесь к администратору системы.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7892
                timestamp: "2026-04-26T10:01:30Z"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '418':
          $ref: '#/components/responses/Teapot'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /logout:
    get:
      tags: [auth]
      summary: Выход из системы
      operationId: logoutUser
      description: |
        Завершает сессию пользователя. Удаляет cookie `token`, `admin_email`, `admin_token`.
        После этого запроса все защищённые эндпоинты потребуют повторного входа.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Сессия завершена, все cookie удалены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: Вы успешно вышли из системы.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '418':
          $ref: '#/components/responses/Teapot'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  # ── ANALYSIS ──────────────────────────────────────────────────────────────

  /analyze:
    post:
      tags: [analysis]
      summary: Запустить анализ профиля или группы ВКонтакте
      operationId: runAnalysis
      description: |
        Принимает идентификатор цели и тип анализа.

        **Анализ профиля (`target_type=user`):**
        Запускает все четыре модуля (`ProfileAnalyzer`, `SocialGraphAnalyzer`,
        `BehaviorAnalyzer`, `CrossCheckAnalyzer`), возвращает суммарный балл 0–100,
        уровень риска и перечень сработавших факторов.

        **Анализ группы (`target_type=group`):**
        Параллельно проверяет участников группы до исчерпания дневного лимита пользователя.
        Возвращает средний балл и распределение по диапазонам риска.

        Каждый проверенный участник группы расходует **1 единицу** дневного лимита.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
            examples:
              user_by_screenname:
                summary: Анализ пользователя по screen_name
                value:
                  target: durov
                  target_type: user
              user_by_id:
                summary: Анализ пользователя по числовому ID
                value:
                  target: "1"
                  target_type: user
              group:
                summary: Анализ группы по короткому имени
                value:
                  target: club12345678
                  target_type: group
      responses:
        '202':
          description: Анализ принят и выполнен, результат сохранён в истории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultResponse'
              examples:
                user_result:
                  summary: Результат анализа профиля
                  value:
                    id: 42
                    target: durov
                    target_type: user
                    score: 30
                    risk_level: LOW
                    reasons:
                      - reason: "Новый аккаунт (2023–2024, +12 бал.)"
                        priority: medium
                        points: 12
                      - reason: "Нет аватарки (+18 бал.)"
                        priority: high
                        points: 18
                    anomalies: []
                    created_at: "2026-04-26T10:05:00Z"
                group_result:
                  summary: Результат анализа группы
                  value:
                    id: 43
                    target: club12345678
                    target_type: group
                    risk_level: MEDIUM
                    members_analyzed: 87
                    average_score: 41.3
                    score_distribution:
                      "0-10": 12
                      "10-20": 18
                      "20-30": 15
                      "30-40": 10
                      "40-50": 8
                      "50-60": 9
                      "60-70": 7
                      "70-80": 4
                      "80-90": 3
                      "90-100": 1
                    created_at: "2026-04-26T10:06:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступ к цели запрещён или профиль скрыт
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Доступ к профилю запрещён
                detail: Профиль скрыт настройками приватности ВКонтакте. Анализ недоступен без открытого профиля.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7896
                timestamp: "2026-04-26T10:05:10Z"
        '404':
          description: Цель не найдена в VK API
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                profile_not_found:
                  summary: Профиль не существует
                  value:
                    title: Профиль не найден
                    detail: Пользователь с указанным ID или screen_name не существует или удалён. Проверьте правильность идентификатора.
                    requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7893
                    timestamp: "2026-04-26T10:05:30Z"
                group_closed:
                  summary: Группа недоступна
                  value:
                    title: Группа не найдена или закрыта
                    detail: Не удалось получить участников группы. Список закрыт настройками приватности или группа не существует.
                    requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7894
                    timestamp: "2026-04-26T10:05:31Z"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '414':
          $ref: '#/components/responses/URITooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '418':
          $ref: '#/components/responses/Teapot'
        '429':
          description: Дневной лимит запросов исчерпан
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Лимит запросов исчерпан
                detail: "Вы израсходовали дневной лимит: 100/100 запросов. Лимит сбрасывается в 00:00 UTC. Обратитесь к администратору для увеличения лимита."
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7895
                timestamp: "2026-04-26T10:05:32Z"
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          description: VK API вернул некорректный ответ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Ошибка внешнего сервиса
                detail: VK API вернул неожиданный ответ. Попробуйте повторить запрос через несколько секунд.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7897
                timestamp: "2026-04-26T10:05:34Z"
        '503':
          description: VK-токены недоступны или исчерпаны
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: VK API недоступен
                detail: Ни один из токенов VK API (VK_TOKEN_1 ... VK_TOKEN_N) не задан или все недействительны. Обратитесь к администратору системы для обновления переменных окружения.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7898
                timestamp: "2026-04-26T10:05:33Z"
        '504':
          description: VK API не ответил в течение допустимого времени
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Таймаут внешнего сервиса
                detail: VK API не ответил за 30 секунд. Сервис может быть временно перегружен — попробуйте повторить запрос позже.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f7899
                timestamp: "2026-04-26T10:05:35Z"

  # ── HISTORY ───────────────────────────────────────────────────────────────

  /history:
    get:
      tags: [history]
      summary: Список записей истории текущего пользователя
      operationId: listHistory
      description: |
        Возвращает историю анализов текущего пользователя с пагинацией.
        Максимум 50 записей за один запрос. Записи отсортированы по дате создания (новые первые).
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное число записей в ответе. Допустимые значения — от 1 до 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
          example: 20
        - name: offset
          in: query
          required: false
          description: Смещение от начала списка для реализации пагинации.
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
      responses:
        '200':
          description: Список записей истории
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total:
                    type: integer
                    description: Общее число записей пользователя (без учёта пагинации)
                    example: 5
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryItem'
              example:
                total: 5
                items:
                  - id: 42
                    target: durov
                    target_type: user
                    risk_level: LOW
                    score: 30
                    created_at: "2026-04-26T10:05:00Z"
                  - id: 41
                    target: club12345678
                    target_type: group
                    risk_level: MEDIUM
                    score: null
                    created_at: "2026-04-25T09:10:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '414':
          $ref: '#/components/responses/URITooLong'
        '418':
          $ref: '#/components/responses/Teapot'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /history/{historyId}:
    get:
      tags: [history]
      summary: Детали одной записи истории
      operationId: getHistoryItem
      description: |
        Возвращает полный результат анализа по идентификатору записи.
        Доступ разрешён только владельцу записи.
      security:
        - cookieAuth: []
      parameters:
        - name: historyId
          in: path
          required: true
          description: Числовой идентификатор записи истории.
          schema:
            type: integer
            minimum: 1
          example: 42
      responses:
        '200':
          description: Полный результат анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultResponse'
              example:
                id: 42
                target: durov
                target_type: user
                score: 30
                risk_level: LOW
                reasons:
                  - reason: "Нет аватарки (+18 бал.)"
                    priority: high
                    points: 18
                anomalies: []
                created_at: "2026-04-26T10:05:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Запись принадлежит другому пользователю
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Доступ запрещён
                detail: Запрошенная запись истории не принадлежит вашему аккаунту. Вы можете просматривать только собственные результаты анализа.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f789b
                timestamp: "2026-04-26T10:10:00Z"
        '404':
          description: Запись не найдена
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Запись не найдена
                detail: Запись истории с идентификатором 42 не существует или была удалена.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f789c
                timestamp: "2026-04-26T10:10:01Z"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '414':
          $ref: '#/components/responses/URITooLong'
        '418':
          $ref: '#/components/responses/Teapot'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  # ── ACCOUNT ───────────────────────────────────────────────────────────────

  /account/delete:
    delete:
      tags: [account]
      summary: Удалить собственный аккаунт
      operationId: deleteAccount
      description: |
        Безвозвратно удаляет аккаунт текущего пользователя и всю связанную историю анализа (CASCADE DELETE).
        После удаления cookie сбрасываются и пользователь разлогинивается.
        Восстановление аккаунта невозможно.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Аккаунт и вся история анализа успешно удалены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: Аккаунт и вся связанная история анализа удалены.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '418':
          $ref: '#/components/responses/Teapot'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  # ── ADMIN ─────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      tags: [admin]
      summary: Список всех пользователей системы
      operationId: adminListUsers
      description: |
        Возвращает полный список зарегистрированных пользователей с их статусами и лимитами.
        Требуются права администратора.
      security:
        - adminCookieAuth: []
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserItem'
              example:
                - id: 3
                  email: user@example.com
                  is_active: true
                  is_admin: false
                  requests_limit: 100
                  requests_today: 12
                  created_at: "2026-04-01T09:00:00Z"
                - id: 7
                  email: blocked@example.com
                  is_active: false
                  is_admin: false
                  requests_limit: 100
                  requests_today: 0
                  created_at: "2026-04-10T11:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '418':
          $ref: '#/components/responses/Teapot'
        '500':
