    Teapot:
      description: "418 — Сервер является чайником и отказывается заваривать кофе (RFC 2324)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Я — чайник
            detail: Сервер является чайником и не может выполнить запрос. Пожалуйста, используйте кофеварку.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78a9
            timestamp: "2026-04-26T10:00:00Z"

    TooManyRequests:
      description: "429 — Превышен допустимый темп запросов к серверу"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Слишком много запросов
            detail: "Дневной лимит исчерпан: 100/100. Лимит сбрасывается в 00:00 UTC. Для увеличения лимита обратитесь к администратору."
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78aa
            timestamp: "2026-04-26T10:00:00Z"

    # 5xx ──────────────────────────────────────────────────────────────────────

    InternalError:
      description: "500 — Непредвиденная внутренняя ошибка сервера"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Внутренняя ошибка сервера
            detail: Произошла непредвиденная ошибка. Повторите запрос позже или обратитесь к администратору, указав requestId.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78ab
            timestamp: "2026-04-26T10:00:00Z"

    NotImplemented:
      description: "501 — Запрошенная функциональность не реализована на сервере"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Функция не реализована
            detail: Запрошенная функциональность ещё не реализована. Следите за обновлениями API.
            requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78ac
            timestamp: "2026-04-26T10:00:00Z"
