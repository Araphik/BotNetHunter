                version: "2.0.0"
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Сервис временно недоступен (БД или зависимости не отвечают)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Сервис недоступен
                detail: Приложение запущено, но одна из зависимостей (PostgreSQL) не отвечает. Повторите запрос через несколько секунд.
                requestId: 0191f3a2-1c4b-7e00-a1b2-3c4d5e6f78c0
                timestamp: "2026-04-26T10:30:00Z"

