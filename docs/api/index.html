    const spec = {"openapi": "3.1.0", "info": {"title": "BotNetHunter API", "version": "1.0.0", "description": "API системы выявления ботов в социальной сети ВКонтакте.\n\n## Аутентификация\nПосле успешного входа сервер выставляет **HttpOnly cookie** `token` (JWT HS256, TTL 24 ч).\nВсе защищённые эндпоинты требуют наличия этой cookie.\nАдминистративные эндпоинты дополнительно требуют cookie `admin_token=admin_session`.\n\n## Структура ошибок\nВсе ответы 4xx / 5xx возвращают JSON-тело с Content-Type `application/problem+json`\nв соответствии со стандартом **RFC 9457 Problem Details**.\n\nПоля ошибки:\n- `title` — краткое описание ошибки.\n- `detail` — подробное описание и способ устранения.\n- `requestId` — идентификатор запроса в формате **UUIDv7** (время-зависимый) для поиска в логах.\n- `timestamp` — метка времени в формате UTC (ISO 8601).\n"}, "servers": [{"url": "http://localhost:8000", "description": "Локальная разработка"}], "tags": [{"name": "auth", "description": "Регистрация, вход и выход"}, {"name": "analysis", "description": "Анализ профилей и групп ВКонтакте"}, {"name": "history", "description": "История запросов текущего пользователя"}, {"name": "account", "description": "Управление собственным аккаунтом"}, {"name": "admin", "description": "Административная панель"}], "paths": {"/register": {"post": {"tags": ["auth"], "summary": "Регистрация нового пользователя", "operationId": "registerUser", "description": "Создаёт новый аккаунт. При успехе выставляет HttpOnly JWT-cookie `token`\nи возвращает профиль созданного пользователя.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthRequest"}, "example": {"email": "user@example.com", "password": "MyStr0ngPass!"}}}}, "responses": {"201": {"description": "Пользователь успешно создан", "headers": {"Set-Cookie": {"description": "HttpOnly JWT-cookie `token` (TTL 24 ч)", "schema": {"type": "string", "example": "token=eyJ...; Path=/; HttpOnly; Max-Age=
