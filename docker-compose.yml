services:
  postgres:
    image: postgres:16-alpine
    container_name: botnethunter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botnethunter}
      POSTGRES_USER: ${POSTGRES_USER:-botnethunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botnethunter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  botnethunter:
    build: .
    image: botnethunter:${APP_VERSION:-1.0.0}
    container_name: botnethunter
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-botnethunter}:${POSTGRES_PASSWORD:-botnethunter}@postgres:5432/${POSTGRES_DB:-botnethunter}
    volumes:
      - ./VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: botnethunter_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - botnethunter

volumes:
  postgres_data:
