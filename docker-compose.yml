services:
  botnethunter:
    build: .
    image: botnethunter:${APP_VERSION:-1.0.0}
    container_name: botnethunter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - ./data:/app/data
      - ./VERSION:/app/VERSION:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: botnethunter_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - botnethunter