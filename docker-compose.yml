services:
  botnethunter:
    build: .
    image: botnethunter:${APP_VERSION:-1.0.0}
    container_name: botnethunter
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      # База данных живёт на хосте — не теряется при пересборке
      - ./data:/app/data
      - ./VERSION:/app/VERSION:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
