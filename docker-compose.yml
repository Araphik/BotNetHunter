services:
  postgres:
    image: postgres:16-alpine
    container_name: botnethunter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botnethunter}
      POSTGRES_USER: ${POSTGRES_USER:-botnethunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botnethunter}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  botnethunter:
    build: .
    image: botnethunter:${APP_VERSION:-1.0.0}
    container_name: botnethunter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-botnethunter}:${POSTGRES_PASSWORD:-botnethunter}@postgres:5432/${POSTGRES_DB:-botnethunter}
      AVATAR_STORAGE_DIR: /app/static/avatars
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./VERSION:/app/VERSION:ro
      - ./static/avatars:/app/static/avatars
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sonar_db:
    image: postgres:15-alpine
    container_name: sonar_db
    restart: unless-stopped
    profiles:
      - prod
    environment:
      POSTGRES_DB: ${SONAR_POSTGRES_DB:-sonar}
      POSTGRES_USER: ${SONAR_POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-sonar_change_me}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      sonar_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/${SONAR_POSTGRES_DB:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_POSTGRES_PASSWORD:-sonar_change_me}
      SONAR_WEB_CONTEXT: ${SONAR_WEB_CONTEXT:-/sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: botnethunter_nginx
    restart: unless-stopped
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./reports:/usr/share/nginx/html/trivy:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      botnethunter:
        condition: service_healthy
      sonarqube:
        condition: service_healthy

volumes:
  postgres_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
