name: CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-job:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: botnethunter
          POSTGRES_USER: botnethunter
          POSTGRES_PASSWORD: botnethunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botnethunter -d botnethunter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          echo "Setting up Python environment..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "Dependencies installed."

      - name: Prepare runtime files
        run: |
          echo "Preparing runtime files..."
          cp .env.example .env
          echo "Build complete."

  syntax-check-job:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.8.6
          cp .env.example .env
      - name: Lint code
        run: |
          ruff check --select E9,F63,F7,F82 analyzers api app config core models utils
      - name: Static syntax check
        run: |
          echo "Checking Python syntax..."
          python -m compileall analyzers api app config core models utils
          echo "No syntax issues found."

  import-check-job:
    runs-on: ubuntu-latest
    needs: build-job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: botnethunter
          POSTGRES_USER: botnethunter
          POSTGRES_PASSWORD: botnethunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botnethunter -d botnethunter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cp .env.example .env
      - name: Import application
        run: |
          echo "Running unit tests..."
          python -c "from app.main import app; print(app.title)"
          echo "Import check passed."

  package-job:
    runs-on: ubuntu-latest
    needs: [ syntax-check-job, import-check-job ]
    outputs:
      app-version: ${{ steps.package-meta.outputs.app_version }}
      image-ref: ${{ steps.package-meta.outputs.image_ref }}
    env:
      IMAGE_NAME: botnethunter
    steps:
      - uses: actions/checkout@v4

      - name: Prepare package metadata
        id: package-meta
        run: |
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_repository="ghcr.io/${repo_lower}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            app_version="${GITHUB_REF_NAME}"
            image_tag="${GITHUB_REF_NAME}"
          else
            app_version="$(cat VERSION)"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              image_tag="pr-${{ github.event.pull_request.number }}"
            else
              image_tag="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')"
            fi
          fi

          image_ref="${image_repository}:${image_tag}"
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=${image_repository}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${image_ref}" >> "$GITHUB_ENV"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Prepare runtime files
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_REF}" \
            --tag "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::7}" \
            --tag "${IMAGE_NAME}:ci" \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_REF}"
          docker push "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA::7}"

      - name: Build distributive artifacts
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --output "dist/${IMAGE_NAME}-${APP_VERSION}-source.zip" \
            HEAD
          docker save "${IMAGE_REF}" \
            | gzip > "dist/${IMAGE_NAME}-${APP_VERSION}-docker-image.tar.gz"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload distributive artifacts
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: botnethunter-distributive-${{ env.APP_VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  sast-sonarqube-job:
    runs-on: ubuntu-latest
    needs: [ syntax-check-job, import-check-job ]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: botnethunter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarQube configuration
        run: |
          test -n "$SONAR_TOKEN" || (echo "SONAR_TOKEN secret is required" && exit 1)
          test -n "$SONAR_HOST_URL" || (echo "SONAR_HOST_URL repository variable is required" && exit 1)

      - name: SonarQube SAST scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Check critical SonarQube vulnerabilities
        run: |
          mkdir -p reports
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get "${SONAR_HOST_URL}/api/issues/search" \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "types=VULNERABILITY" \
            --data-urlencode "severities=BLOCKER,CRITICAL" \
            --data-urlencode "resolved=false" \
            --output reports/sonarqube-critical-vulnerabilities.json

          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("reports/sonarqube-critical-vulnerabilities.json")
          data = json.loads(report_path.read_text())
          total = int(data.get("total", 0))
          summary = Path("reports/sonarqube-critical-vulnerabilities.md")
          summary.write_text(
              "# SonarQube critical vulnerabilities report\n\n"
              f"Open CRITICAL/BLOCKER vulnerabilities: {total}\n",
              encoding="utf-8",
          )
          print(f"{total} critical/blocker vulnerabilities found")
          raise SystemExit(1 if total else 0)
          PY

      - name: Upload SonarQube SAST report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-critical-vulnerabilities-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 1

  container-scan-trivy-job:
    runs-on: ubuntu-latest
    needs: [ package-job ]
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Aqua Trivy table scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.package-job.outputs.image-ref }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Run Aqua Trivy JSON scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.package-job.outputs.image-ref }}
          format: json
          output: trivy-image-report.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Build Trivy HTML report
        if: always()
        shell: bash
        run: |
          if [ -s trivy-image-report.json ]; then
            python3 scripts/trivy_json_to_html.py \
              trivy-image-report.json \
              trivy-image-report.html \
              --image-ref "${{ needs.package-job.outputs.image-ref }}" \
              --markdown-output trivy-image-report.md
          fi

      - name: Publish Trivy report summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Trivy container scan"
            echo
            echo "- Image: \`${{ needs.package-job.outputs.image-ref }}\`"
            echo "- GitHub-rendered report: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/trivy-reports/trivy-image-report.md"
            echo "- HTML report file: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/trivy-reports/trivy-image-report.html"
            echo "- Raw \`trivy-image-report.json\` is generated inside this job, but is not uploaded as an artifact to avoid GitHub artifact quota failures."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s trivy-image-report.json ]; then
            {
              echo
              echo "_Trivy JSON report was not generated._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image-report.json)"
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-report.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-report.json)"
          medium="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-image-report.json)"
          low="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-image-report.json)"
          unknown="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "UNKNOWN")] | length' trivy-image-report.json)"

          {
            echo
            echo "### Summary"
            echo
            echo "| Severity | Count |"
            echo "| --- | ---: |"
            echo "| CRITICAL | $critical |"
            echo "| HIGH | $high |"
            echo "| MEDIUM | $medium |"
            echo "| LOW | $low |"
            echo "| UNKNOWN | $unknown |"
            echo "| **TOTAL** | **$total** |"
            echo
            echo "### Top findings"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$total" -eq 0 ]; then
            echo "_No vulnerabilities found._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| Severity | ID | Package | Installed | Fixed | Target | Title |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            jq -r '
              def cell:
                (. // "n/a")
                | tostring
                | gsub("\\|"; "\\|")
                | gsub("\r|\n"; " ")
                | if length > 140 then .[0:137] + "..." else . end;
              def rank:
                if . == "CRITICAL" then 0
                elif . == "HIGH" then 1
                elif . == "MEDIUM" then 2
                elif . == "LOW" then 3
                else 4 end;
              [
                .Results[]? as $result
                | ($result.Vulnerabilities // [])[]
                | {
                    severity: .Severity,
                    id: .VulnerabilityID,
                    url: (.PrimaryURL // ""),
                    pkg: .PkgName,
                    installed: .InstalledVersion,
                    fixed: (.FixedVersion // "no fix"),
                    target: $result.Target,
                    title: (.Title // .Description // "n/a")
                  }
              ]
              | sort_by(.severity | rank)
              | .[:20][]
              | "| " + (.severity | cell)
                + " | " + (if .url == "" then (.id | cell) else "[" + (.id | cell) + "](" + .url + ")" end)
                + " | " + (.pkg | cell)
                + " | " + (.installed | cell)
                + " | " + (.fixed | cell)
                + " | " + (.target | cell)
                + " | " + (.title | cell)
                + " |"
            ' trivy-image-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Trivy report to repository branch
        if: always() && github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'master') && hashFiles('trivy-image-report.html') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          git init "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git -C "$publish_dir" fetch origin trivy-reports --depth=1; then
            git -C "$publish_dir" checkout -B trivy-reports FETCH_HEAD
          else
            git -C "$publish_dir" checkout --orphan trivy-reports
          fi

          cp trivy-image-report.md "$publish_dir/README.md"
          cp trivy-image-report.md "$publish_dir/trivy-image-report.md"
          cp trivy-image-report.html "$publish_dir/trivy-image-report.html"
          cp trivy-image-report.json "$publish_dir/trivy-image-report.json"

          git -C "$publish_dir" add README.md trivy-image-report.md trivy-image-report.html trivy-image-report.json
          git -C "$publish_dir" commit -m "Publish Trivy report for ${GITHUB_SHA::7}" || exit 0
          git -C "$publish_dir" push origin trivy-reports

  release-job:
    runs-on: ubuntu-latest
    needs: [ package-job, container-scan-trivy-job, sast-sonarqube-job ]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_VERSION: ${{ needs.package-job.outputs.app-version }}
      IMAGE_REF: ${{ needs.package-job.outputs.image-ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release distributive files
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --output "dist/botnethunter-${APP_VERSION}-source.zip" \
            HEAD
          docker pull "${IMAGE_REF}"
          docker save "${IMAGE_REF}" \
            | gzip > "dist/botnethunter-${APP_VERSION}-docker-image.tar.gz"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create or update GitHub Release
        run: |
          notes="Автоматическая сборка BotNetHunter ${APP_VERSION}.

          Docker image: ${IMAGE_REF}"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "BotNetHunter ${APP_VERSION}" \
              --notes "${notes}"
          fi

  deploy-job:
    runs-on: ubuntu-latest
    needs: [ package-job, sast-sonarqube-job, container-scan-trivy-job ]
    if: github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Application successfully deployed."
