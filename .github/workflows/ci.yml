name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-job:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: botnethunter
          POSTGRES_USER: botnethunter
          POSTGRES_PASSWORD: botnethunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botnethunter -d botnethunter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          echo "Setting up Python environment..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "Dependencies installed."

      - name: Prepare runtime files
        run: |
          echo "Preparing runtime files..."
          cp .env.example .env
          echo "Build complete."

  syntax-check-job:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cp .env.example .env
      - name: Static syntax check
        run: |
          echo "Linting code..."
          python -m compileall analyzers api app config core models utils
          echo "No syntax issues found."

  import-check-job:
    runs-on: ubuntu-latest
    needs: build-job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: botnethunter
          POSTGRES_USER: botnethunter
          POSTGRES_PASSWORD: botnethunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botnethunter -d botnethunter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cp .env.example .env
      - name: Import application
        run: |
          echo "Running unit tests..."
          python -c "from app.main import app; print(app.title)"
          echo "Import check passed."

  package-job:
    runs-on: ubuntu-latest
    needs: [ syntax-check-job, import-check-job ]
    env:
      IMAGE_NAME: botnethunter
    steps:
      - uses: actions/checkout@v4

      - name: Read application version
        run: echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Prepare runtime files
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${APP_VERSION}" \
            --tag "${IMAGE_NAME}:ci" \
            .

      - name: Build distributive artifacts
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --output "dist/${IMAGE_NAME}-${APP_VERSION}-source.zip" \
            HEAD
          docker save "${IMAGE_NAME}:${APP_VERSION}" \
            | gzip > "dist/${IMAGE_NAME}-${APP_VERSION}-docker-image.tar.gz"
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload distributive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: botnethunter-distributive-${{ env.APP_VERSION }}
          path: dist/
          if-no-files-found: error

  deploy-job:
    runs-on: ubuntu-latest
    needs: [ package-job ]
    environment: production
    steps:
      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Application successfully deployed."
